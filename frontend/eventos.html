<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventos | Conecta</title>

    <link rel="stylesheet" href="css/atendimentos.css">
    <link rel="stylesheet" href="css/eventos.css">
</head>
<body>

    <div class="container">

        <aside class="sidebar">
            <div class="logo">
                <h1>Conecta</h1>
                <p>Rede de apoio social</p>
            </div>

            <nav>
                <a href="painel.html">Início</a>
                <a href="atendimentos.html">Atendimentos</a>
                <a href="doacoes.html">Doações</a>
                <a href="recursos.html">Recursos</a>
                <a href="voluntarios.html">Voluntários</a>
                <a href="eventos.html" class="ativo">Eventos</a>
            </nav>
        </aside>

        <main class="conteudo">

            <header class="cabecalho">
                <div>
                    <h2>Eventos</h2>
                    <p>Organize e acompanhe os eventos da instituição.</p>
                </div>

                <div class="perfil">
                    <div class="avatar"></div>
                    <div>
                        <strong id="nome-usuario"></strong>
                        <span id="tipo-usuario"></span>
                    </div>
                </div>
            </header>

            <section class="secao-formulario">

                <h3 id="titulo-formulario">Novo evento</h3>

                <form id="form-evento">

                    <input type="hidden" id="id-evento">

                    <div class="campo">
                        <label for="nome">Nome do evento</label>
                        <input
                            type="text"
                            id="nome"
                            placeholder="Ex.: Campanha de arrecadação"
                            required
                        >
                    </div>

                    <div class="campo">
                        <label for="descricao">Descrição</label>
                        <textarea
                            id="descricao"
                            placeholder="Descreva o evento..."
                        ></textarea>
                    </div>

                    <div class="campo">
                        <label for="local">Local</label>
                        <input
                            type="text"
                            id="local"
                            placeholder="Ex.: Sede da instituição"
                        >
                    </div>

                    <div class="campos-linha">

                        <div class="campo">
                            <label for="data-evento">Data do evento</label>
                            <input
                                type="date"
                                id="data-evento"
                                required
                            >
                        </div>

                        <div class="campo">
                            <label for="capacidade">Capacidade de participantes</label>
                            <input
                                type="number"
                                id="capacidade"
                                min="0"
                                step="1"
                                placeholder="Ex.: 100"
                            >
                        </div>

                    </div>

                    <div class="campo">
                        <label for="status">Status do evento</label>
                        <select id="status">
                            <option value="planejado">Planejado</option>
                            <option value="confirmado">Confirmado</option>
                            <option value="realizado">Realizado</option>
                            <option value="cancelado">Cancelado</option>
                        </select>
                    </div>

                    <div id="mensagem-evento"></div>

                    <div class="botoes-formulario">

                        <button type="submit" id="botao-salvar">
                            Cadastrar evento
                        </button>

                        <button
                            type="button"
                            id="botao-cancelar"
                            style="display: none;"
                        >
                            Cancelar
                        </button>

                    </div>

                </form>

            </section>

            <section class="secao-listagem">

                <div class="titulo-listagem">
                    <h3>Eventos cadastrados</h3>
                    <p>Consulte e organize os eventos da instituição.</p>
                </div>

                <div class="tabela-container">

                    <table>
                        <thead>
                            <tr>
                                <th>Evento</th>
                                <th>Local</th>
                                <th>Data</th>
                                <th>Capacidade</th>
                                <th>Status</th>
                                <th>Ações</th>
                            </tr>
                        </thead>

                        <tbody id="lista-eventos"></tbody>
                    </table>

                </div>

            </section>

        </main>

    </div>

    <script src="js/eventos.js"></script>

</body>
</html>
