<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recursos | Conecta</title>

    <link rel="stylesheet" href="css/atendimentos.css">
    <link rel="stylesheet" href="css/recursos.css">
</head>
<body>

    <div class="container">

        <aside class="sidebar">
            <div class="logo">
                <h1>Conecta</h1>
                <p>Rede de apoio social</p>
            </div>

            <nav>
                <a href="painel.html">Início</a>
                <a href="atendimentos.html">Atendimentos</a>
                <a href="doacoes.html">Doações</a>
                <a href="recursos.html" class="ativo">Recursos</a>
                <a href="voluntarios.html">Voluntários</a>
                <a href="eventos.html">Eventos</a>
            </nav>
        </aside>

        <main class="conteudo">

            <header class="cabecalho">
                <div>
                    <h2>Recursos</h2>
                    <p>Organize e acompanhe os recursos da instituição.</p>
                </div>

                <div class="perfil">
                    <div class="avatar"></div>
                    <div>
                        <strong id="nome-usuario"></strong>
                        <span id="tipo-usuario"></span>
                    </div>
                </div>
            </header>

            <section class="secao-formulario">

                <h3 id="titulo-formulario">Novo recurso</h3>

                <form id="form-recurso">

                    <input type="hidden" id="id-recurso">

                    <div class="campo">
                        <label for="nome">Nome do recurso</label>
                        <input
                            type="text"
                            id="nome"
                            placeholder="Ex.: Cestas básicas"
                            required
                        >
                    </div>

                    <div class="campo">
                        <label for="descricao">Descrição</label>
                        <textarea
                            id="descricao"
                            placeholder="Descreva o recurso..."
                        ></textarea>
                    </div>

                    <div class="campos-linha">

                        <div class="campo">
                            <label for="quantidade">Quantidade disponível</label>
                            <input
                                type="number"
                                id="quantidade"
                                min="0"
                                step="0.01"
                                placeholder="Ex.: 50"
                                required
                            >
                        </div>

                        <div class="campo">
                            <label for="unidade">Unidade</label>
                            <input
                                type="text"
                                id="unidade"
                                placeholder="Ex.: unidades, kg, caixas"
                                required
                            >
                        </div>

                    </div>

                    <div class="campo">
                        <label for="quantidade-minima">Quantidade mínima</label>
                        <input
                            type="number"
                            id="quantidade-minima"
                            min="0"
                            step="0.01"
                            value="0"
                        >
                    </div>

                    <div id="mensagem-recursos"></div>

                    <div class="botoes-formulario">
                        <button type="submit" id="botao-salvar">
                            Cadastrar recurso
                        </button>

                        <button
                            type="button"
                            id="botao-cancelar"
                            style="display: none;"
                        >
                            Cancelar
                        </button>
                    </div>

                </form>

            </section>

            <section class="secao-listagem">

                <div class="titulo-listagem">
                    <h3>Recursos cadastrados</h3>
                    <p>Acompanhe as quantidades disponíveis na instituição.</p>
                </div>

                <div class="tabela-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Nome</th>
                                <th>Descrição</th>
                                <th>Quantidade</th>
                                <th>Mínimo</th>
                                <th>Situação</th>
                                <th>Ações</th>
                            </tr>
                        </thead>

                        <tbody id="lista-recursos"></tbody>
                    </table>
                </div>

            </section>

        </main>

    </div>

    <script src="js/recursos.js"></script>

</body>
</html>
